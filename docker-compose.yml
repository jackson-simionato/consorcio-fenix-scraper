services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: consorcio_fenix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consorcio_fenix"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgis-data:/var/lib/postgresql/data

volumes:
  postgis-data:
