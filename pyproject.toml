[project]
name = "consorcio-fenix-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "beautifulsoup4>=4.12.0",
    "geoalchemy2>=0.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
consorcio-fenix = "consorcio_fenix_scraper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
